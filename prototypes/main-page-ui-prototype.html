<!DOCTYPE html>
<!--
  ⚠️ PROTOTYPE — throwaway visual mockup for the Main Page redesign (Rust + egui target).
  Palette: B (Deep Navy/Ice Blue, dark, 定稿) + L1/L2/L3 light complements.
  Structure & state mapping are LOCKED by the spec; only the visual execution varies.
  This is NOT production code. The real implementation will be programmatic painting
  in egui (paint_gear pattern), not this HTML/CSS.
  Open by double-clicking; switch variants with the bottom bar or ←/→ arrow keys.
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Main Page UI Prototype — B + Light</title>
<style>
  /* ============ design tokens (per-variant, see bottom) ============ */
  :root {
    --bg: #11161d; --surface: #181f28; --elevated: #202934; --border: #2b3542;
    --text: #e7ecf2; --text2: #aab4c0; --muted: #778392;
    --accent: #4d8ccb; --accent-hover: #5a99d4; --accent-ink: #0b1a2a;
    --success: #69a88b; --warn: #c29a58; --err: #c87575; --warnblue: #5a7fa3;
    --warn-fg: color-mix(in srgb, var(--warn) 82%, white);
    --busy-ink: color-mix(in srgb, var(--accent) 70%, white);
    --r-hero: 14px; --r-cta: 8px; --r-row: 8px; --r-small: 6px;
    --cta-gradient: none; --cta-inner-hi: transparent; --hero-tint: transparent;
    --spacing-scale: 1; --status-size: 34px; --eyebrow-track: 0.14em;
    --header-h: 52px; --content-max: 600px;
    --frame-border:#262a30; --titlebar-bg:#0c0f13; --titlebar-stroke:#1c2025;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1a1d22 0%, #0d0e11 60%) fixed #0d0e11;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 44px 16px 120px;
    display: flex; justify-content: center;
  }

  /* ============ window frame ============ */
  .app-window {
    /* 窗口框架 = spec §40 首帧参考 620×520（默认 = 最小内尺寸） */
    width: 620px; max-width: 100%;
    height: 520px;
    background: var(--bg);
    border: 1px solid var(--frame-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
  }
  .titlebar {
    height: 30px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--titlebar-bg); border-bottom: 1px solid var(--titlebar-stroke);
    font-size: 12px; color: var(--muted);
  }
  .tb-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .tb-note { margin-left: auto; font-size: 11px; color: color-mix(in srgb, var(--muted) 70%, transparent); letter-spacing: .02em; }

  .app-header {
    height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; user-select: none; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px; flex: none;
    background: linear-gradient(150deg, var(--accent-hover), var(--accent));
    display: grid; place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 3px rgba(0,0,0,.4);
  }
  .brand-mark svg { display: block; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--r-small);
    border: 1px solid transparent; background: transparent; color: var(--text2);
    display: grid; place-items: center; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  .icon-btn:active { transform: translateY(1px); }

  /* ============ content ============ */


  .content {
    max-width: var(--content-max);
    width: 100%;
    margin: 0 auto;
    padding: calc(26px * var(--spacing-scale)) 28px calc(26px * var(--spacing-scale));
    display: flex; flex-direction: column; gap: calc(14px * var(--spacing-scale));
    flex: 1 1 auto;
  }
  /* 黄金比例垂直呼吸：上留白 : 下留白 = φ ≈ 1.618 : 1（随窗口高度自适应，不写绝对像素） */
  .spacer-up { flex: 1.618; min-height: 0; }
  .spacer-down { flex: 1; min-height: 0; }
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-hero);
    padding: calc(26px * var(--spacing-scale)) calc(30px * var(--spacing-scale)) calc(24px * var(--spacing-scale));
    position: relative;
  }
  .hero::before { /* very subtle atmosphere lint */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--hero-tint); pointer-events: none;
  }
  .hero::after { /* inner top hairline highlight */
    content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px;
    background: var(--hero-hi, transparent); border-radius: inherit; pointer-events: none;
  }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: var(--eyebrow-track);
    text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 8px; margin-bottom: calc(8px * var(--spacing-scale));
  }
  .eyebrow::before {
    content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--accent);
    opacity: .85;
  }
  .hero-status {
    font-size: var(--status-size); font-weight: 650; line-height: 1.15;
    letter-spacing: -0.01em; color: var(--text);
  }
  .hero-status .ok { color: var(--success); font-weight: 600; }
  .hero-status .bad { color: var(--err); }
  .hero-status.busy { color: var(--text2); }
  .supporting { margin-top: calc(10px * var(--spacing-scale)); color: var(--text2); font-size: 13.5px; line-height: 1.55; }
  .supporting b { color: var(--text); font-weight: 600; }
  .supporting .muted { color: var(--muted); }

  .primary-cta {
    margin-top: calc(22px * var(--spacing-scale));
    width: 100%; max-width: 340px;
    height: 44px; border: none; border-radius: var(--r-cta);
    background: var(--cta-gradient, var(--accent));
    color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: .01em;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; box-shadow: inset 0 0 0 1px var(--cta-border, transparent), 0 6px 18px rgba(0,0,0,.35);
    transition: background .12s, transform .06s, filter .12s;
    position: relative;
  }
  .primary-cta::after { /* inner top highlight */
    content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 1px;
    background: var(--cta-inner-hi); border-radius: inherit;
  }
  .primary-cta:hover { background: var(--accent-hover); filter: brightness(1.04); }
  .primary-cta:active { transform: translateY(1px); filter: brightness(.96); }
  .primary-cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .primary-cta[disabled] {
    background: var(--elevated); color: var(--muted); cursor: default;
    box-shadow: none; filter: none; transform: none;
  }
  .primary-cta[disabled]:hover, .primary-cta[disabled]:active { background: var(--elevated); }

  .patch-update {
    margin-top: calc(14px * var(--spacing-scale));
    display: flex; align-items: center; gap: 10px; min-height: 26px;
    font-size: 13px; color: var(--text2);
  }
  .update-link {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 10px; border-radius: var(--r-small); border: 1px solid transparent;
    background: transparent; color: var(--text2); font: inherit; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .update-link:hover { background: var(--surface); color: var(--text); border-color: var(--border); }
  .update-link[disabled] { opacity: .55; cursor: default; }
  .update-link[disabled]:hover { background: transparent; color: var(--text2); border-color: transparent; }
  .update-link .spin { animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .update-note { font-size: 12.5px; }
  .update-note.ok { color: var(--success); }
  .update-note.fail { color: var(--err); }
  .progress-mini {
    width: 100%; max-width: 300px; height: 4px; border-radius: 2px;
    background: var(--elevated); overflow: hidden;
  }
  .progress-mini > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .progress-cap { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }

  /* ============ health warning ============ */
  .health-warning {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px; border-radius: var(--r-row);
    border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
    background: color-mix(in srgb, var(--warn) 9%, transparent);
    color: var(--warn-fg);
    font-size: 13px; cursor: pointer;
    transition: background .12s;
  }
  .health-warning:hover { background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .health-warning .go {
    margin-left: auto; color: var(--text2); font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 5px;
  }

  /* ============ secondary group ============ */
  .secondary-group { display: flex; flex-direction: column; }
  .sec-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 11px 12px; border-radius: var(--r-row);
    background: transparent; border: 1px solid transparent; color: var(--text2);
    font: inherit; font-size: 13.5px; text-align: left; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .sec-row + .sec-row { border-top-color: color-mix(in srgb, var(--border) 45%, transparent); }
  .sec-row:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--text); }
  .sec-row:active { transform: translateY(1px); }
  .sec-row[disabled] { opacity: .4; cursor: default; }
  .sec-row[disabled]:hover { background: transparent; color: var(--text2); transform: none; }
  .sec-row.warnblue { color: var(--warnblue); }
  .sec-row.warnblue:hover { color: color-mix(in srgb, var(--warnblue) 75%, white); }

  /* ============ status dock (fixed bottom bar) ============ */
  .status-dock {
    border-top: 1px solid var(--border);
    background: var(--bg);
    padding: 10px 26px;
    flex: none;
  }
  .status-bar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--text2);
  }
  .sb-item { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.run { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 18%, transparent); }
  .dot.stop { background: var(--muted); }
  .dot.busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .sb-item.ok { color: var(--success); }
  .sb-item.fail { color: var(--err); }
  .sb-item.busy-text { color: var(--busy-ink); }

  /* ============ confirm modal ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(4,6,9,.6); backdrop-filter: blur(2px);
    display: grid; place-items: center;
  }
  .modal {
    width: 340px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-hero); padding: 22px 24px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }
  .modal h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .modal p { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .btn {
    height: 32px; padding: 0 18px; border-radius: var(--r-small);
    border: 1px solid var(--border); background: var(--elevated); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }

  /* ============ prototype controls (not part of the design) ============ */
  .proto {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 50; display: flex; align-items: center; gap: 10px;
    background: #171a20; border: 1px solid #2c3440; border-radius: 12px;
    padding: 8px 12px; box-shadow: 0 12px 32px rgba(0,0,0,.5);
    font-size: 12.5px; color: #cfd6df; flex-wrap: wrap; justify-content: center;
  }
  .proto .sep { width: 1px; height: 20px; background: #2c3440; }
  .proto button, .proto select {
    background: #20262f; color: #e3e8ee; border: 1px solid #343e4a;
    border-radius: 7px; font: inherit; padding: 5px 9px; cursor: pointer;
  }
  .proto button:hover { background: #2a313c; }
  .proto .variant-label { font-weight: 600; min-width: 240px; text-align: center; }
  .proto .readout { font-size: 11px; color: #7c8794; font-variant-numeric: tabular-nums; }
  .proto .kbd { font-size: 11px; color: #9aa3ad; }

  .tag {
    position: fixed; top: 14px; left: 18px; z-index: 5;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: #566270; border: 1px dashed #3a4350; border-radius: 6px; padding: 4px 8px;
  }
  [hidden] { display: none !important; }

  .variant-b { --bg:#0f151c; --surface:#151e28; --elevated:#1c2835; --border:#293746;
    --text:#e8edf3; --text2:#a9b5c3; --muted:#778596;
    --accent:#5c91c7; --accent-hover:#6a9fd1;
    --success:#6ba88f; --warn:#c39a5b; --err:#c97979; --warnblue:#587a9d;
    --r-hero:18px; --r-cta:10px; --r-row:10px; --r-small:7px;
    --status-size:36px; --eyebrow-track:.18em; --spacing-scale:1.08;
    --cta-gradient:linear-gradient(180deg, #6699cc 0%, #5183b7 100%);
    --cta-inner-hi:rgba(255,255,255,.28); --cta-border:rgba(255,255,255,.14);
    --hero-hi:rgba(255,255,255,.05);
    --hero-tint:radial-gradient(420px 220px at 18% -20%, rgba(92,145,199,.10), transparent 70%);
  }
  /* ===== Light Palette（定稿 L1 — Ice Mist）：与 B 互补，供未来 Light Mode；切换功能未实现，仅保留色值 ===== */
  .variant-l1 { --bg:#f3f6f9; --surface:#ffffff; --elevated:#e8eef5; --border:#d3dce6;
    --text:#1c2630; --text2:#47566a; --muted:#8494a7;
    --accent:#3e76ac; --accent-hover:#35689a;
    --success:#3f8e63; --warn:#a67c2e; --err:#c2554e; --warnblue:#3e6f9e;
    --warn-fg:color-mix(in srgb, var(--warn) 55%, black);
    --busy-ink:color-mix(in srgb, var(--accent) 45%, black);
    --r-hero:18px; --r-cta:10px; --r-row:10px; --r-small:7px;
    --status-size:36px; --eyebrow-track:.18em; --spacing-scale:1.08;
    --cta-inner-hi:rgba(255,255,255,.4);
    --cta-gradient:linear-gradient(180deg, #4f88bd 0%, #3a6ea3 100%);
    --hero-hi:rgba(255,255,255,.6);
    --hero-tint:radial-gradient(420px 220px at 18% -20%, rgba(93,145,199,.08), transparent 70%);
    --frame-border:#c9d2dc; --titlebar-bg:#e8edf2; --titlebar-stroke:#d3dce6;
  }
</style>
</head>
<body class="variant-b" id="root">

<div class="tag">Prototype — throwaway</div>

<div class="app-window">
  <div class="titlebar">
    <span class="tb-dot"></span>
    <span id="tb-title">OpenSteamTool Manager</span>
    <span class="tb-note">native window chrome (simulated)</span>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M9.5 15 15 10l-5.5-5v3.4H5v3.2h4.5V15Z" fill="rgba(255,255,255,.95)"/>
          <circle cx="15.4" cy="14.8" r="2.4" stroke="rgba(255,255,255,.85)" stroke-width="1.4"/>
        </svg>
      </span>
      <span class="brand-name" id="brand-name">OpenSteamTool Manager</span>
    </div>
    <button class="icon-btn" id="settings-btn" title="Settings (gear)">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10" cy="10" r="5.0"/>
        <path d="M10.00 5.80L10.00 2.70 12.97 7.03 15.16 4.84 14.20 10.00 17.30 10.00 12.97 12.97 15.16 15.16 10.00 14.20 10.00 17.30 7.03 12.97 4.84 15.16 5.80 10.00 2.70 10.00 7.03 7.03 4.84 4.84Z"/>
        <path d="M10 8.6a1.4 1.4 0 1 0 0 2.8a1.4 1.4 0 1 0 0-2.8Z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </header>

  <main class="content">
    <div class="spacer-up"></div>
    <section class="hero">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="hero-status" id="hero-status"></div>
      <div class="supporting" id="supporting" hidden></div>
      <button class="primary-cta" id="primary-cta" disabled></button>
      <div class="patch-update" id="patch-update"></div>
    </section>

    <div class="health-warning" id="health-warning" hidden></div>

    <section class="secondary-group" id="secondary-group"></section>
    <div class="spacer-down"></div>
  </main>

  <footer class="status-dock">
    <div class="status-bar" id="status-bar"></div>
  </footer>
</div>

<!-- confirm modal (ADR-0007/#36 exception, only Exit+Uninstall / Uninstall+Restart while Steam running) -->
<div class="modal-overlay" id="modal" hidden>
  <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="actions">
      <button class="btn" id="modal-cancel"></button>
      <button class="btn primary" id="modal-confirm"></button>
    </div>
  </div>
</div>

<!-- prototype controls -->
<div class="proto">
  <button id="prev" title="previous variant">◀</button>
  <span class="variant-label" id="variant-label">B — Deep Navy / Ice</span>
  <button id="next" title="next variant">▶</button>
  <span class="sep"></span>
  <select id="scenario"></select>
  <span class="sep"></span>
  <button id="lang-btn">EN</button>
  <button id="health-btn">健康警示</button>
  <button id="confirm-btn">确认框</button>
  <span class="sep"></span>
  <span class="readout" id="readout"></span>
  <span class="kbd">(←/→ variant)</span>
</div>

    priApplyLaunch: "Apply Patch & Launch Steam", priLaunch: "Launch Steam", priRestart: "Restart Steam",
    priFixPath: "Open Settings to Fix", priRetry: "Retry",
    busyApplying: "Applying patch…", busyLaunching: "Launching Steam…", busyRestarting: "Restarting Steam…",
    busyClosing: "Closing Steam…", busyDownloading: "Downloading patch…", busyExtracting: "Extracting patch…", busyChecking: "Checking for updates…",
    secLaunchNormal: "Launch Steam Normally", secUninstall: "Uninstall Patch",
    secUninstallRestart: "Uninstall Patch & Restart Steam", secExitUninstall: "Exit Steam & Uninstall Patch",
    upCheck: "Check for Patch Update", upChecking: "Checking…", upDownload: "Download & Extract New Version",
    upDownloading: "Downloading patch…", upExtracting: "Extracting patch…", upToDate: "Patch is up to date",
    upCheckFailed: "Check failed", upDlFailed: "Download failed",
    hwPending: "Steam is not yet supported", hwMissing: "Steam core files not found", hwGo: "Settings →",
    sbRunning: "Steam is running", sbStopped: "Steam is not running",
    resApplied: "Patch applied", resUninstalled: "Patch uninstalled", resLaunched: "Steam launched",
    resRestarted: "Steam restarted", resFailed: "Failed to apply patch", resKillFailed: "Failed to close Steam",
    opFailedHero: "Failed to apply patch",
    confirmTitle: "Confirm Close Steam", confirmBody: "Steam is currently running. This will close it first:",
    confirmYes: "Close & Continue", confirmNo: "Cancel",
    scenario: {
      notdeployed: "Not applied · Steam stopped", filesmissing: "Not applied · patch files missing",
      deployedStop: "Applied · Steam stopped", deployedRun: "Applied · Steam running",
      pathInvalid: "Steam path invalid", busyApply: "Busy · applying patch", busyDownload: "Busy · downloading patch",
      opFail: "Operation failed (apply)", upAvailable: "Update Available", upToDateSc: "Update · up to date"
    },
  },
};
const VARIANT_NAMES = {
  b: "B — Deep Navy / Ice  (dark) ★",
  l1: "L1 — Ice Mist  (light) ★",
};

/* ============================ state ============================ */
const state = {
  lang: "zh",
  deploy: "notdeployed",          // notdeployed | deployed
  filesMissing: false,
  pathInvalid: false,
  steam: "stopped",               // stopped | running
  busy: null,                     // null | applying | launching | restarting | closing
  update: "idle",                 // idle | checking | available | downloading | extracting | upToDate | checkFailed | dlFailed
  dlProgress: 68,
  health: null,                   // null | pending | missing
  result: null,                   // null | {ok, key}
  confirm: false,                 // confirm modal (prototype toggle)
  pendingConfirmAction: null,
};

/* ============================ icons ============================ */
/* stroke-based, consistent 1.5 width, 20 viewBox — matches egui paint_gear convention */
const icons = {
  play: '<svg width="15" height="15" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.5 4.8c0-.9 1-1.5 1.8-1L15.4 9c.8.5.8 1.6 0 2.1l-7.1 5.2c-.8.6-1.9 0-1.9-1V4.8Z"/></svg>',
  restart: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.7a7.3 7.3 0 1 0 3.1 14"/><path d="M9.5 2.7 13 6.1"/><path d="M9.5 2.7 13.4.8"/></svg>',
  uninstall: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v8.5"/><path d="m6.5 8 3.5 3.5L13.5 8"/><path d="M3.5 15.5h13"/></svg>',
  exit: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v6"/><path d="M6.5 6.6a5 5 0 1 0 7 0"/></svg>',
  settings: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="5.0"/><path d="M10.00 5.80L10.00 2.70 12.97 7.03 15.16 4.84 14.20 10.00 17.30 10.00 12.97 12.97 15.16 15.16 10.00 14.20 10.00 17.30 7.03 12.97 4.84 15.16 5.80 10.00 2.70 10.00 7.03 7.03 4.84 4.84Z"/><path d="M10 8.6a1.4 1.4 0 1 0 0 2.8a1.4 1.4 0 1 0 0-2.8Z" fill="currentColor" stroke="none"/></svg>',
  download: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5V12"/><path d="m6.5 8.5 3.5 3.5 3.5-3.5"/><path d="M3.5 15.5h13"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.708 14.53A5.6 5.6 0 0 0 15.6 10"/><path d="M13.292 5.47A5.6 5.6 0 0 0 4.4 10"/><polygon points="13.1,10 15.1,7.4 17.7,10" fill="currentColor" stroke="none"/><polygon points="6.9,10 4.9,12.6 2.3,10" fill="currentColor" stroke="none"/></svg>',
  spinner: '<svg class="spin" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 2a8 8 0 1 1-8 8"/></svg>',
  warning: '<svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 18 16.5H2L10 3Z"/><path d="M10 9v3.5"/><path d="M10 15.2v.3"/></svg>',
  dot: '<span class="dot"></span>',
};

/* ============================ view model ============================ */
function icon(k) { return icons[k] || ""; }
const t = () => S[state.lang];

const BUSY_STAGE = {
  applying: "busyApplying", launching: "busyLaunching", restarting: "busyRestarting",
  closing: "busyClosing", downloading: "busyDownloading", extracting: "busyExtracting", checking: "busyChecking",
};

function vm() {
  const s = t();
  let primary = { icon: "play", label: s.priApplyLaunch, disabled: false, action: "apply" };
  let heroStatus = state.pathInvalid ? s.statusNotApplied
    : state.deploy === "deployed" ? s.statusApplied : s.statusNotApplied;
  let heroClass = "";
  let supporting = null;
  const busy = !!state.busy;

  // §27: busy 时 Hero 原位进入 Stage-driven Busy State（不可用状态不显示）
  if (state.busy) {
    const stage = s[BUSY_STAGE[state.busy]];
    return { primary: { icon: "spinner", label: stage, disabled: true, action: null }, heroStatus: stage, heroClass: "busy", supporting: null, busy: true };
  }

  // §30: operation failure takes over hero
  if (state.result && !state.result.ok) {
    heroStatus = s.opFailedHero; heroClass = "bad return";
  }

  if (state.pathInvalid) {
    primary = { icon: "settings", label: s.priFixPath, disabled: false, action: "fixPath" };
    supporting = { title: s.pathInvalid, body: s.supPathBody };
  } else if (state.deploy === "notdeployed") {
    if (state.filesMissing && state.update !== "available") {
      primary = { icon: "play", label: s.priApplyLaunch, disabled: true, action: "apply" };
      supporting = { title: s.supFilesTitle, body: s.supFilesBody };
    } else if (state.filesMissing && state.update === "available") {
      primary = { icon: "play", label: s.priApplyLaunch, disabled: true, action: "apply" };
    }
  } else { // deployed
    if (state.steam === "running") {
      primary = { icon: "restart", label: s.priRestart, disabled: false, action: "restart" };
    } else {
      primary = { icon: "play", label: s.priLaunch, disabled: false, action: "launch" };
    }
  }

  return { primary, heroStatus, heroClass, supporting, busy };
}

/* ============================ render ============================ */
function el(id) { return document.getElementById(id); }

function render() {
  const s = t();
  const v = vm();

  el("eyebrow").textContent = s.eyebrow;
  const hs = el("hero-status");
  hs.className = "hero-status" + (v.heroClass ? " " + v.heroClass : "");
  if (v.heroClass.includes("bad")) {
    hs.innerHTML = `<span class="bad">${v.heroStatus}</span>`;
  } else if (v.busy) {
    hs.innerHTML = v.heroStatus;
  } else if (v.heroStatus === s.statusApplied) {
    // §37: 正常状态以中性色为主，语义色只做点缀（✓）
    hs.innerHTML = `<span class="ok">✓</span> ${v.heroStatus}`;
  } else {
    hs.innerHTML = v.heroStatus;
  }

  const sup = el("supporting");
  if (v.supporting) {
    sup.hidden = false;
    sup.innerHTML = `<b>${v.supporting.title}</b> · <span class="muted">${v.supporting.body}</span>`;
  } else { sup.hidden = true; sup.innerHTML = ""; }

  const cta = el("primary-cta");
  cta.disabled = v.primary.disabled;
  cta.innerHTML = icon(v.primary.icon) + `<span>${v.primary.label}</span>`;
  cta.onclick = () => v.primary.action && onPrimary(v.primary.action);

  renderUpdate();
  renderHealth();
  renderSecondary();
  renderStatusBar();
  renderModal();
  renderReadout();
}

function renderUpdate() {
  const s = t();
  const box = el("patch-update");
  const u = state.update;
  const busyClass = state.busy ? " disabled" : "";
  let html = "";

  const checking = u === "checking" || state.busy === "checking";
  const downloading = u === "downloading" || state.busy === "downloading";
  const extracting = u === "extracting" || state.busy === "extracting";

  if (downloading) {
    html = `<button class="update-link" disabled>${icon("spinner")}<span>${s.upDownloading}</span></button>` +
      `<div class="progress-mini"><i style="width:${state.dlProgress}%"></i></div>` +
      `<span class="progress-cap">${state.dlProgress}%</span>`;
  } else if (extracting) {
    html = `<button class="update-link" disabled>${icon("spinner")}<span>${s.upExtracting}</span></button>`;
  } else if (u === "available") {
    html = `<button class="update-link${busyClass}" ${state.busy?"disabled":""}>${icon("download")}<span>${s.upDownload}</span></button>`;
  } else if (checking) {
    html = `<button class="update-link" disabled>${icon("spinner")}<span>${s.upChecking}</span></button>`;
  } else {
    let note = "";
    if (u === "upToDate") note = `<span class="update-note ok">${s.upToDate}</span>`;
    else if (u === "checkFailed") note = `<span class="update-note fail">${s.upCheckFailed}</span>`;
    else if (u === "dlFailed") note = `<span class="update-note fail">${s.upDlFailed}</span>`;
    html = `<button class="update-link${busyClass}" ${state.busy?"disabled":""}>${icon("refresh")}<span>${s.upCheck}</span></button>${note}`;
  }
  box.innerHTML = html;
}

function renderHealth() {
  const s = t();
  const row = el("health-warning");
  if (!state.health) { row.hidden = true; row.innerHTML = ""; return; }
  row.hidden = false;
  const text = state.health === "pending" ? s.hwPending : s.hwMissing;
  row.innerHTML = icon("warning") + `<span>${text}</span><span class="go">${s.hwGo}</span>`;
}

function renderSecondary() {
  const s = t();
  const g = el("secondary-group");
  const busy = !!state.busy;
  const dis = state.pathInvalid || busy;
  let rows = [];

  if (state.pathInvalid) {
    // operations disabled
  } else if (state.deploy === "notdeployed") {
    rows.push({ icon: "play", label: s.secLaunchNormal, action: "launchNormal", cls: "" });
  } else if (state.steam === "running") {
    rows.push({ icon: "exit", label: s.secExitUninstall, action: "exitUninstall", cls: "warnblue" });
    rows.push({ icon: "uninstall", label: s.secUninstallRestart, action: "uninstallRestart", cls: "" });
  } else {
    rows.push({ icon: "uninstall", label: s.secUninstall, action: "uninstall", cls: "" });
    rows.push({ icon: "uninstall", label: s.secUninstallRestart, action: "uninstallRestart", cls: "" });
  }

  g.innerHTML = rows.map(r =>
    `<button class="sec-row ${r.cls}" ${dis||busy?"disabled":""} data-action="${r.action}">${icon(r.icon)}<span>${r.label}</span></button>`
  ).join("");
  g.querySelectorAll(".sec-row").forEach(b => b.onclick = () => onSecondary(b.dataset.action));
}

function launchSuccessHidden() {
  // §35: launch/restart success must not render when Steam is stopped afterward
  if (!state.result || !state.result.ok) return false;
  if (state.result.key === "launched" || state.result.key === "restarted") {
    return state.steam === "stopped";
  }
  return false;
}

function renderStatusBar() {
  const s = t();
  const items = [];
  items.push(state.steam === "running"
    ? { dot: "run", text: s.sbRunning, cls: "" }
    : { dot: "stop", text: s.sbStopped, cls: "" });

  if (state.busy) {
    const labels = { applying: s.busyApplying, launching: s.busyLaunching, restarting: s.busyRestarting,
      closing: s.busyClosing, downloading: s.busyDownloading, extracting: s.busyExtracting, checking: s.busyChecking };
    items.push({ dot: "busy", text: labels[state.busy], cls: "busy-text" });
  }

  if (state.result && !launchSuccessHidden()) {
    const okMap = { applied: s.resApplied, uninstalled: s.resUninstalled, launched: s.resLaunched, restarted: s.resRestarted };
    const failMap = { applied: s.resFailed, kill: s.resKillFailed };
    if (state.result.ok) {
      items.push({ dot: "", text: "✓ " + okMap[state.result.key], cls: "ok" });
    } else {
      items.push({ dot: "", text: "✕ " + (failMap[state.result.key] || s.resFailed), cls: "fail" });
    }
  }

  el("status-bar").innerHTML = items.map(i => {
    const dot = i.dot ? `<span class="dot ${i.dot}"></span>` : "";
    return `<span class="sb-item ${i.cls}">${dot}<span>${i.text}</span></span>`;
  }).join("");
}

function renderModal() {
  const modal = el("modal");
  if (!state.confirm || !state.pendingConfirmAction) { modal.hidden = true; return; }
  const s = t();
  modal.hidden = false;
  const actionLabel = state.pendingConfirmAction === "exitUninstall" ? s.secExitUninstall : s.secUninstallRestart;
  el("modal-title").textContent = s.confirmTitle;
  el("modal-body").innerHTML = `${s.confirmBody}<br><b>${actionLabel}</b>`;
  el("modal-cancel").textContent = s.confirmNo;
  el("modal-confirm").textContent = s.confirmYes;
}

function renderReadout() {
  el("readout").textContent =
    `deploy:${state.deploy}${state.filesMissing?"/missing":""}${state.pathInvalid?"/invalid":""} · steam:${state.steam} · busy:${state.busy||"—"} · update:${state.update} · health:${state.health||"—"}`;
}

/* ============================ interactions ============================ */
function onPrimary(action) {
  if (action === "fixPath") return;
  // no confirm for primary actions (§45)
  if (action === "apply") fakeBusy("applying", "deployed", false);
  else if (action === "launch") fakeBusy("launching", null, null);
  else if (action === "restart") fakeBusy("restarting", null, null, "restarted");
}

function onSecondary(action) {
  const s = t();
  const needsConfirm = (action === "exitUninstall" || action === "uninstallRestart") && state.steam === "running";
  if (needsConfirm) {
    state.pendingConfirmAction = action;
    state.confirm = true;
    renderModal();
    return;
  }
  if (action === "uninstall") fakeBusy("uninstalling", null, null, "uninstalled", false);
  else if (action === "uninstallRestart") fakeBusy("uninstalling", null, null, "uninstalled", false);
  else if (action === "exitUninstall") fakeBusy("uninstalling", null, null, "uninstalled", false);
  else if (action === "launchNormal") fakeBusy("launching", null, null, "launched", true);
}

function fakeBusy(stage, afterDeploy, filesMissing, resultKey, resultOk = true) {
  // prototype: show busy for a moment, then transition
  if (stage === "uninstalling") {
    state.deploy = "notdeployed";
    state.steam = "stopped";
    state.result = { ok: true, key: "uninstalled" };
    state.busy = null; render(); return;
  }
  state.busy = stage === "applying" ? "applying" : stage;
  render();
  setTimeout(() => {
    if (stage === "applying") {
      state.deploy = "deployed";
      state.filesMissing = false;
      state.result = { ok: true, key: "applied" };
      if (state.steam === "running") state.steam = "stopped"; // apply → launch
      state.busy = null;
    } else if (stage === "launching" || stage === "restarting") {
      state.busy = null;
      state.steam = "running";
      if (resultKey) state.result = { ok: true, key: resultKey };
    }
    render();
  }, 900);
}

el("modal-confirm").onclick = () => {
  state.confirm = false; state.pendingConfirmAction = null;
  state.deploy = "notdeployed"; state.steam = "stopped";
  state.result = { ok: true, key: "uninstalled" };
  render();
};
el("modal-cancel").onclick = () => { state.confirm = false; state.pendingConfirmAction = null; render(); };

/* settings button: opens Settings → Steam in the real app; here just a hint */
el("settings-btn").onclick = () => state.health ? (state.health = null) : (state.health = "pending"), render();

/* ============================ scenarios ============================ */
const scenarios = [
  { key: "notdeployed", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: false, pathInvalid: false, steam: "stopped", busy: null, update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "filesmissing", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: true, pathInvalid: false, steam: "stopped", busy: null, update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "deployedStop", apply(s) { Object.assign(s, { deploy: "deployed", filesMissing: false, pathInvalid: false, steam: "stopped", busy: null, update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "deployedRun", apply(s) { Object.assign(s, { deploy: "deployed", filesMissing: false, pathInvalid: false, steam: "running", busy: null, update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "pathInvalid", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: false, pathInvalid: true, steam: "stopped", busy: null, update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "busyApply", apply(s) { Object.assign(s, { deploy: "deployed", filesMissing: false, pathInvalid: false, steam: "stopped", busy: "applying", update: "idle", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "busyDownload", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: true, pathInvalid: false, steam: "stopped", busy: "downloading", update: "downloading", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "opFail", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: false, pathInvalid: false, steam: "stopped", busy: null, update: "idle", result: { ok: false, key: "applied" }, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "upAvailable", apply(s) { Object.assign(s, { deploy: "notdeployed", filesMissing: true, pathInvalid: false, steam: "stopped", busy: null, update: "available", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
  { key: "upToDateSc", apply(s) { Object.assign(s, { deploy: "deployed", filesMissing: false, pathInvalid: false, steam: "running", busy: null, update: "upToDate", result: null, confirm: false, pendingConfirmAction: null, health: null }); } },
];

/* ============================ controls ============================ */
const variants = ["b", "l1"];
let vidx = 0;

function setVariant(v, push = true) {
  vidx = variants.indexOf(v); if (vidx < 0) vidx = 0;
  document.body.className = "variant-" + variants[vidx];
  el("variant-label").textContent = VARIANT_NAMES[variants[vidx]];
  if (push && history.replaceState) history.replaceState(null, "", "?variant=" + variants[vidx]);
  render();
}
function cycle(d) { setVariant(variants[(vidx + d + variants.length) % variants.length]); }
el("prev").onclick = () => cycle(-1);
el("next").onclick = () => cycle(1);

const sel = el("scenario");
scenarios.forEach((sc, i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = S[state.lang].scenario[sc.key];
  sel.appendChild(o);
});
sel.onchange = () => { scenarios[+sel.value].apply(state); render(); };

el("lang-btn").onclick = () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  el("lang-btn").textContent = state.lang === "zh" ? "EN" : "中文";
  // rebuild scenario labels & render
  [...sel.options].forEach((o, i) => o.textContent = S[state.lang].scenario[scenarios[i].key]);
  render();
};
el("health-btn").onclick = () => {
  state.health = state.health ? null : "pending";
  el("health-btn").style.outline = state.health ? "1px solid #c29a58" : "";
  render();
};
el("confirm-btn").onclick = () => {
  // only meaningful in steam-running scenarios
  state.steam = "running"; state.deploy = "deployed";
  state.pathInvalid = false; state.pendingConfirmAction = "exitUninstall";
  state.confirm = true; render();
};

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  else if (e.key === "ArrowRight") cycle(1);
});

/* ============================ boot ============================ */
(function () {
  const q = new URLSearchParams(location.search).get("variant");
  setVariant(q && variants.includes(q) ? q : "b", false);
  scenarios[0].apply(state);
  render();
})();
</script>
</body>
</html>

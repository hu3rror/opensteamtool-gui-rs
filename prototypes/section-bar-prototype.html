<!DOCTYPE html>
<!--
  ⚠️ PROTOTYPE — throwaway visual mockup. Question: "把设置项目里的 accent 竖条都换成降权横条，值不值得？"
  （Hero eyebrow 已采纳降权横条；本章评估全系统"accent 短条"语言是否统一为降权横条）

  Three treatments of the section-title accent bar, across the Settings dialog and the
  Main Page compat section, switchable via ?v= and the bottom bar, inside faithful hosts.

  A — 混合（现状 + 已定 Hero）：Hero 降权横条 + 章节标题 3×13 accent 竖条
  B — 全系统降权横条：Hero 降权横条 + 章节标题 10×2 border 降权横条
  C — 降权竖条：Hero 降权横条 + 章节标题 3×13 border 竖条（保留竖条形态、去掉 accent）

  This is NOT production code. Real implementation is egui painting in ui.rs
  (card_title / compat_section / hero_eyebrow; settings 宽度测量需同步).
  Open by double-clicking; switch with the bottom bar or ←/→ arrow keys.
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>Section Bar Prototype — 短条语言统一</title>
<style>
  /* ============ design tokens ============ */
  :root {
    --bg:#0f151c; --surface:#151e28; --elevated:#1c2835; --border:#293746;
    --text:#e8edf3; --text2:#a9b5c3; --muted:#778596;
    --accent:#5c91c7; --accent-hover:#6a9fd1; --success:#6ba88f;
    --page-bg:#0d0e11; --frame-border:#262a30; --titlebar-bg:#0c0f13; --titlebar-stroke:#1c2025;
    --eyebrow-track:.16em;
  }
  body.light {
    --bg:#f3f6f9; --surface:#ffffff; --elevated:#e8eef5; --border:#d3dce6;
    --text:#1c2630; --text2:#47566a; --muted:#8494a7;
    --accent:#3e76ac; --accent-hover:#35689a; --success:#3f8e63;
    --page-bg:#dfe5ec; --frame-border:#c9d2dc; --titlebar-bg:#e8edf2; --titlebar-stroke:#d3dce6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding: 40px 16px 130px;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }

  /* ============ window frame ============ */
  .app-window {
    width: 620px; max-width: 100%;
    background: var(--bg);
    border: 1px solid var(--frame-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .app-window.settings { width: 580px; }
  .titlebar {
    height: 30px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--titlebar-bg); border-bottom: 1px solid var(--titlebar-stroke);
    font-size: 12px; color: var(--muted);
  }
  .tb-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
  .tb-note { margin-left: auto; font-size: 11px; color: var(--muted); opacity: .7; letter-spacing: .02em; }

  .app-header {
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; user-select: none; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px; flex: none;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 78%, black));
    display: grid; place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 1px 3px rgba(0,0,0,.4);
  }
  .brand-mark svg { display: block; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .01em; }

  .content { padding: 22px 28px; }
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 30px 24px;
    position: relative;
    margin-bottom: 14px;
  }
  .hero::after { /* inner top hairline highlight（原型既有） */
    content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 1px;
    background: color-mix(in srgb, var(--border) 60%, transparent);
    border-radius: inherit; pointer-events: none;
  }

  /* ---- hero eyebrow：已定稿 = 降权横条（所有变体一致） ---- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .eyebrow .bar { width: 10px; height: 2px; border-radius: 2px; background: var(--border); opacity: .9; flex: none; }
  .eyebrow .word {
    font-size: 12px; font-weight: 600; letter-spacing: var(--eyebrow-track);
    text-transform: uppercase; color: var(--muted);
  }
  .status-big {
    font-size: 36px; font-weight: 650; line-height: 1.15; letter-spacing: -0.01em;
    color: var(--text);
  }

  /* ---- 章节标题（card_title 同款形态；短条随变体） ---- */
  .sec-title {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 10px;
  }
  .sec-title .bar { width: 3px; height: 13px; background: var(--accent); flex: none; }
  .sec-title .txt { font-size: 13.5px; font-weight: 600; color: var(--text); }

  /* B：章节短条 → 降权横条 */
  body[data-variant="b"] .sec-title .bar {
    width: 10px; height: 2px; border-radius: 2px; background: var(--border); opacity: .9;
  }
  /* C：章节短条 → 竖条形态保留、accent 降为 border */
  body[data-variant="c"] .sec-title .bar {
    width: 3px; height: 13px; background: var(--border);
  }

  /* ---- 控件（忠实近似） ---- */
  .combo {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--elevated); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
    font-size: 13px; color: var(--text);
  }
  .combo .chev { color: var(--muted); font-size: 11px; }
  .checkbox {
    display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text);
    cursor: default; user-select: none;
  }
  .checkbox .box {
    width: 16px; height: 16px; border-radius: 4px; flex: none;
    border: 1.5px solid var(--muted); background: transparent;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px; padding: 6px 16px;
    font-size: 13px; font-weight: 600; font-family: inherit;
    background: var(--elevated); color: var(--text);
    border: 1px solid transparent;
  }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.small { padding: 4px 12px; font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .row .left { display: flex; align-items: center; gap: 10px; }
  .link { color: var(--accent); font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--elevated); border-radius: 12px; padding: 3px 10px;
    font-size: 12px; color: var(--muted);
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .hint { font-size: 12.5px; color: var(--text2); }

  /* ---- 设置对话框 ---- */
  .dlg-heading { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: transparent; color: var(--text2); border: 1px solid transparent;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .dlg-section { margin-bottom: 16px; }

  /* ============ floating switcher (not part of the design) ============ */
  .proto {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #fff; color: #111;
    border-radius: 999px; padding: 8px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    font-size: 12.5px; z-index: 9;
    border: 1px solid #e2e2e2;
  }
  .proto button {
    border: none; background: #eee; color: #111;
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
    font-family: inherit;
  }
  .proto button:hover { background: #ddd; }
  .proto .arrow { width: 30px; padding: 5px 0; text-align: center; background: #eee; }
  .proto .v-label { font-weight: 700; min-width: 190px; text-align: center; }
  .proto .sep { width: 1px; height: 18px; background: #ddd; }
  .proto .readout { color: #666; font-size: 11.5px; }
  .proto .kbd { color: #999; font-size: 11px; }
</style>
</head>
<body id="root" data-variant="a">
<!-- ============ 主页面窗口 ============ -->
<div class="app-window">
  <div class="titlebar">
    <span class="tb-dot"></span><span>OpenSteamTool Manager</span>
    <span class="tb-note">主页面 — Hero + 兼容性小节</span>
  </div>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M9.5 15 15 10l-5.5-5v3.4H5v3.2h4.5V15Z" fill="rgba(255,255,255,.95)"/>
          <circle cx="15.4" cy="14.8" r="2.4" stroke="rgba(255,255,255,.85)" stroke-width="1.4"/>
        </svg>
      </span>
      <span class="brand-name">OpenSteamTool Manager</span>
    </div>
  </header>
  <main class="content">
    <section class="hero">
      <div class="eyebrow"><span class="bar"></span><span class="word">PATCH</span></div>
      <div class="status-big">未应用</div>
    </section>
    <div class="sec-title"><span class="bar"></span><span class="txt">兼容性</span></div>
    <div class="row">
      <div class="left">
        <span class="badge"><span class="dot"></span>未检查</span>
      </div>
      <div class="left">
        <button class="btn small">详情</button>
        <button class="btn small">预缓存</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ 设置对话框窗口 ============ -->
<div class="app-window settings">
  <div class="titlebar">
    <span class="tb-dot"></span><span>设置</span>
    <span class="tb-note">设置对话框（常规/关于页签）</span>
  </div>
  <main class="content">
    <div class="dlg-heading">设置</div>
    <div class="tabs">
      <span class="tab active">常规</span>
      <span class="tab">Steam</span>
      <span class="tab">关于</span>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">语言</span></div>
      <span class="combo">中文简体 <span class="chev">▾</span></span>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">主题</span></div>
      <span class="combo">跟随系统 <span class="chev">▾</span></span>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">托盘</span></div>
      <label class="checkbox"><span class="box"></span>最小化到系统托盘</label>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">应用更新</span></div>
      <div class="row">
        <span class="hint">当前版本 v0.8.0</span>
        <button class="btn small">检查更新</button>
      </div>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">GitHub</span></div>
      <span class="link">github.com/hu3rror/opensteamtool-gui-rs ↗</span>
    </div>

    <div class="dlg-section">
      <div class="sec-title"><span class="bar"></span><span class="txt">向导</span></div>
      <div class="row">
        <span class="hint">首次启动向导可重新运行</span>
        <button class="btn small">重新运行向导</button>
      </div>
    </div>
  </main>
</div>

<!-- prototype controls -->
<div class="proto">
  <button class="arrow" id="prev" title="上一个变体">◀</button>
  <span class="v-label" id="v-label">A · 混合（现状）</span>
  <button class="arrow" id="next" title="下一个变体">▶</button>
  <span class="sep"></span>
  <button id="theme-btn">主题：深色</button>
  <span class="sep"></span>
  <span class="readout" id="readout"></span>
  <span class="kbd">(←/→ 切变体)</span>
</div>

<script>
"use strict";
/* ============================ variants ============================ */
const VARIANTS = [
  { key: "a", name: "混合（现状）" },
  { key: "b", name: "全系统降权横条" },
  { key: "c", name: "降权竖条" },
];
let variant = "a";
let light = false;

/* ============================ render ============================ */
function setVariant(v) {
  variant = v;
  document.body.dataset.variant = v;
  const meta = VARIANTS.find(x => x.key === v);
  document.getElementById("v-label").textContent = v.toUpperCase() + " · " + meta.name;
  const url = new URL(location.href);
  url.searchParams.set("v", v);
  history.replaceState(null, "", url);
  renderReadout();
}

function setLight(on) {
  light = on;
  document.body.classList.toggle("light", on);
  document.getElementById("theme-btn").textContent = "主题：" + (on ? "浅色" : "深色");
  renderReadout();
}

function renderReadout() {
  document.getElementById("readout").textContent =
    variant.toUpperCase() + " · " + (light ? "浅色" : "深色");
}

/* ============================ wiring ============================ */
function cycle(dir) {
  const i = VARIANTS.findIndex(x => x.key === variant);
  setVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}
document.getElementById("prev").addEventListener("click", () => cycle(-1));
document.getElementById("next").addEventListener("click", () => cycle(1));
document.getElementById("theme-btn").addEventListener("click", () => setLight(!light));
document.addEventListener("keydown", (e) => {
  if (e.target && e.target.matches && e.target.matches("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); cycle(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); cycle(1); }
});

/* ============================ init ============================ */
const p = new URLSearchParams(location.search).get("v");
if (p && VARIANTS.some(x => x.key === p)) setVariant(p);
setLight(new URLSearchParams(location.search).get("t") === "light");
</script>
</body>
</html>

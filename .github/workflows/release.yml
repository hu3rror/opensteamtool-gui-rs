# 发布：推 v* 标签或手动 → 构建打包 → GitHub Release。
# 打包复用 tools/build-release.ps1（本地与 CI 同源）。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual only; tag push uses tag name."
        required: true
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          # 与 cache-warm.yml 共用 key（覆盖 job-id 差异），tag 发布时命中 main 的缓存
          shared-key: release
          # 只在 main 保存：tag 上保存的缓存其他 ref 读不到，纯浪费存储
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          $v = "$env:DISPATCH_VERSION"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "$env:GITHUB_REF_NAME" }
          if ([string]::IsNullOrWhiteSpace($v)) { $v = 'dev' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build & package (portable zip)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          & ./tools/build-release.ps1 -Version $v

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: opensteamtool-manager-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

      # Sync the scoop manifest in the user-maintained muggle bucket
      # (hu3rror/scoop-muggle) so scoop picks up the new release. Requires a
      # classic/fine-grained PAT with repo scope on that bucket, stored as the
      # MUGGLE_BUCKET_TOKEN secret; skipped until it is configured.
      - name: Update scoop manifest (muggle bucket)
        if: ${{ secrets.MUGGLE_BUCKET_TOKEN != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MUGGLE_BUCKET_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          # gh is preinstalled; GH_TOKEN above authenticates both gh and (via
          # setup-git) the git clone/push against the bucket repo.
          gh auth setup-git
          gh repo clone hu3rror/scoop-muggle muggle-bucket
          # Hash the zip built in this job - the same artifact the release uploaded.
          & ./tools/update-scoop-manifest.ps1 `
            -Version $env:RELEASE_VERSION `
            -ManifestPath "muggle-bucket/bucket/opensteamtool-gui-rs.json" `
            -ZipPath "opensteamtool-manager-$env:RELEASE_VERSION.zip"
          Push-Location muggle-bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/opensteamtool-gui-rs.json
          if (git diff --cached --quiet) {
            Write-Host "manifest unchanged, skip push"
          } else {
            git commit -m "chore: bump opensteamtool-gui-rs to v$env:RELEASE_VERSION"
            git push origin master
          }
          Pop-Location

[package]
name = "opensteamtool-manager"
version = "0.2.4"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
winreg = "0.56"
sysinfo = "0.39"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["ico"] }
tray-icon = "0.24"

[build-dependencies]
embed-resource = "3.0"
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

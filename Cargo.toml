[package]
name = "opensteamtool-manager"
version = "0.9.1"
edition = "2024"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
winreg = "0.56"
sysinfo = "0.39"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
tray-icon = "0.24"
toml_edit = "0.25.13"
sha2 = "0.10"

[build-dependencies]
embed-resource = "3.0"
# ADR-0022：dev 默认 limited 调试信息（行号/回溯可用，无变量查看）；完整调试用 --profile dev-full
[profile.dev]
debug = "limited"

[profile.dev-full]
inherits = "dev"
debug = "full"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
